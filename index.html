<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal website of Viktor Varenik (@kotleni) — software engineer writing about web tooling, infrastructure and Linux."
    />
    <meta name="theme-color" content="#faf2ee" />
    <title>kotleni's web</title>
    <style>
      html {
        background: #faf2ee;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #221c24;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('y2k-theme');
          var mode =
            stored === 'light' || stored === 'dark' ? stored : 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = dark
            ? 'dark'
            : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#221c24' : '#faf2ee');
        } catch (error) {
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
