<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal website of Viktor Varenik (@kotleni) — software engineer writing about web tooling, infrastructure and Linux."
    />
    <meta name="theme-color" content="#d4d0c6" />
    <title>kotleni's web</title>
    <style>
      html {
        background: #d4d0c6;
      }

      @media (prefers-color-scheme: dark) {
        html {
          background: #1a1a1a;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kotleni:theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#1a1a1a' : '#d4d0c6');
        } catch (error) {
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
